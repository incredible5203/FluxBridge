<ng-container *ngLet="{ mobile: mobile$ | async, banners: banners$ | async } as state">
  <tui-carousel
    *ngIf="state.banners?.length"
    [duration]="state.banners.length > 1 ? 15000 : 0"
    [draggable]="false"
  >
    <ng-container *ngFor="let banner of state.banners">
      <ng-container *tuiItem>
        <a class="banner" [safetyLink]="banner.linkUrl">
          <div
            class="banner__container"
            [innerHTML]="getBannerText(banner, state.mobile) | safeSanitizer"
          ></div>
          <button
            class="banner__button"
            [innerHTML]="getButtonText(banner) | safeSanitizer"
          ></button>
        </a>
      </ng-container>
    </ng-container>
  </tui-carousel>
</ng-container>
